apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mernspace-client-ui-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, PATCH, GET, POST, OPTIONS, HEAD"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://*.adityavyas.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - pizza.adityavyas.com
    secretName: pizza-tls
  rules:
  - host: pizza.adityavyas.com
    http:
      paths:
        # Next.js session routes. These must sort ahead of the broader
        # /api/auth(/|$)(.*) regex in client-ui-api-ingress, otherwise ingress
        # sends them to auth-service, where they 404 and the storefront cannot
        # refresh tokens. ingress-nginx orders regex paths by length, so keep
        # the (/|$)(.*) suffix to make these longer than the /api/auth rule.
        - path: /api/auth/accessToken(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: client-ui
              port:
                number: 3000
        - path: /api/auth/refresh(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: client-ui
              port:
                number: 3000
        - path: /
          pathType: Prefix
          backend:
            service:
              name: client-ui
              port:
                number: 3000
