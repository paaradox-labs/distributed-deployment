apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mernspace-client-ui-image-cache-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Buffering must be on for the nginx disk cache to work.
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    # Cache key zone is declared globally via http-snippet in the
    # ingress-nginx-controller ConfigMap (img_cache).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_cache img_cache;
      proxy_cache_lock on;
      proxy_cache_key "$uri$is_args$args";
      proxy_cache_valid 200 7d;
      proxy_ignore_headers Cache-Control;
      proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
      add_header X-Proxy-Cache-Status $upstream_cache_status;
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - pizza.adityavyas.com
    secretName: pizza-tls
  rules:
  - host: pizza.adityavyas.com
    http:
      paths:
        # Cache the Next.js image-optimizer responses so modal opens and repeat
        # visitors get images from the local nginx cache instead of re-fetching
        # from S3 in us-east-1 and re-resizing at the origin every time.
        # Cloudflare treats these extensionless URLs as DYNAMIC, so this cache
        # is the only origin-side layer keeping them fast.
        - path: /_next/image
          pathType: Exact
          backend:
            service:
              name: client-ui
              port:
                number: 3000
